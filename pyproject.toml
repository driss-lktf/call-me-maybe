[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling for LLMs via constrained decoding."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.10"
exclude = ["llm_sdk", "build", "dist", "\\.venv"]

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
ignore_errors = true
ignore_missing_imports = true
follow_imports = "skip"
